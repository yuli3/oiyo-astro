name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: read

jobs:
  build-check:
    name: Build & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install type checker
        run: npm i --no-save @astrojs/check typescript

      - name: Active production type check
        run: npm run type-check:active
        env:
          NODE_OPTIONS: --max-old-space-size=3072

      - name: Legacy type diagnostics (advisory)
        id: legacy-typecheck
        # The migrated legacy/shim tree still has a large explicit baseline.
        # Preserve the real step outcome instead of masking it with `|| true`;
        # release-blocking active contracts are covered by Vitest + audits below.
        continue-on-error: true
        run: npx astro check --minimumSeverity error
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Report legacy type debt honestly
        if: steps.legacy-typecheck.outcome == 'failure'
        run: echo '::warning::Legacy Astro type diagnostics failed. The failure is visible and remains tracked debt; tests, build, and contract audits still gate this release.'

      - name: Test
        run: npm run test -- --run

      - name: Build
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Audit assessment release gates
        run: npm run audit:assessment-release-gates

      - name: Audit page structure
        run: npm run audit:page-structure


      - name: Audit assessment analytics contracts
        run: npm run audit:assessment-analytics

      - name: Audit exploration recommender contracts and executable golden
        run: npm run audit:exploration-recommender

      - name: Audit role visual schema, direct locales, and accessibility contracts
        run: npm run audit:role-visual

      - name: Audit local personal-profile history privacy and regression contracts
        run: npm run audit:profile-history

      - name: Audit stateless relationship comparison privacy and consent contracts
        run: npm run audit:relationship-comparison

      - name: Audit sample-report derived-artifact and non-diagnostic contracts
        run: npm run audit:sample-report

      - name: Audit type-advice epistemic lanes and abuse-avoidance contracts
        run: npm run audit:type-advice

      - name: Audit reflective life-role-balance boundaries
        run: npm run audit:reflective-life-role-balance

      - name: Audit affiliate category/disclosure/click-payload gates
        run: npm run audit:affiliate

  sitemap-submit:
    name: Submit Sitemap (GSC + Bing + IndexNow)
    runs-on: ubuntu-latest
    # The exact-commit Cloudflare Pages gate may legitimately wait up to one
    # hour; this job must outlive that gate plus the local build.
    timeout-minutes: 80
    needs: build-check
    # Only run on pushes to main, not on PRs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        # Produces dist/sitemap-index.xml + dist/sitemap-*.xml so IndexNow URL
        # collection can read them from disk instead of HTTP-fetching the live
        # site from CI (Cloudflare 403s that self-fetch — see gotcha #10).
        # NODE_OPTIONS raises V8's old-space ceiling — the site's grown past
        # Node's default limit on the 7GB GH-hosted runner (OOM'd at ~2GB on
        # 2026-07-09, run 29054228016).
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Audit assessment release gates
        run: npm run audit:assessment-release-gates

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests python-dotenv google-api-python-client google-auth

      - name: Wait for Cloudflare Pages deployment
        # Search submission must follow the deployment for this exact commit,
        # not a blind delay that may still leave the previous build live.
        run: python scripts/wait-cloudflare-check.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_CHECK_TIMEOUT: "3600"

      - name: Submit sitemap to all engines
        run: python scripts/sitemap-submit.py
        env:
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
          INDEXNOW_API_KEY: ${{ secrets.INDEXNOW_API_KEY }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          # oiyo.net is registered in Search Console as a domain property, not
          # a URL-prefix property — must match exactly or GSC returns 403.
          GSC_SITE_URL: sc-domain:oiyo.net
